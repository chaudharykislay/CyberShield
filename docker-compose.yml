version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cybershield-postgres
    environment:
      POSTGRES_DB: cybershield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replace_with_your_local_password}
    ports:
      - "5433:5432"
    volumes:
      - cybershield_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cybershield"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield-backend
    ports:
      - "8080:8080"
    environment:
      - DB_PASSWORD=${DB_PASSWORD:-replace_with_your_local_password}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cybershield
      - SPRING_DATASOURCE_USERNAME=postgres
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybershield-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  cybershield_pgdata:
